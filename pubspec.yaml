name: sos_guard
description: Premium SOS emergency Flutter app with Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.4.1
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.7.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
